<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pokémon con Tailwind</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  </head>

  <body class="bg-[url('fondo.webp')] bg-cover bg-center bg-fixed min-h-screen">
    <div class="max-w-7xl mx-auto px-4 py-10">
      <div class="flex justify-center items-center gap-3 mb-10">
        <img id="pokebola" class="w-20" />

        <h1 class="text-4xl font-bold">Galería Pokémon</h1>
      </div>

      <div
        id="pokemones"
        class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6 items-start"
      ></div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
